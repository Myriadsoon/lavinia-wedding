services:
  wedding_access.access_check:
    class: Drupal\wedding_access\Access\WeddingAccessCheck
    tags:
      - { name: access_check, applies_to: _wedding_auth_required }

  wedding_access.route_subscriber:
    class: Drupal\wedding_access\Routing\RouteSubscriber
    tags:
      - { name: event_subscriber }

  wedding_access.login_redirect_subscriber:
    class: Drupal\wedding_access\EventSubscriber\LoginRedirectSubscriber
    arguments:
      - '@current_user'
    tags:
      - { name: event_subscriber }
